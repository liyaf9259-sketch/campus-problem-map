<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report a Problem - Campus Problem Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h2>Report a Campus Problem</h2>
        
        <form method="POST">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="title" style="display: block; font-weight: bold; margin-bottom: 5px;">Category / Issue Title:</label>
                <input type="text" id="title" name="title" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="e.g., broken fan, leaking pipe">
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="description" style="display: block; font-weight: bold; margin-bottom: 5px;">Description:</label>
                <textarea id="description" name="description" rows="3" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="Provide details..."></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="building" style="display: block; font-weight: bold; margin-bottom: 5px;">Building Name:</label>
                <input type="text" id="building" name="building" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="e.g., IT block">
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="floor" style="display: block; font-weight: bold; margin-bottom: 5px;">Floor:</label>
                    <input type="text" id="floor" name="floor" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="e.g., 1st floor">
                </div>
                
                <div class="form-group" style="flex: 1;">
                    <label for="room_number" style="display: block; font-weight: bold; margin-bottom: 5px;">Room Number:</label>
                    <input type="text" id="room_number" name="room_number" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="e.g., 20">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="area" style="display: block; font-weight: bold; margin-bottom: 5px;">Area / Landmark:</label>
                <input type="text" id="area" name="area" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="e.g., near faculty room">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="priority" style="display: block; font-weight: bold; margin-bottom: 5px;">Priority Level:</label>
                <select id="priority" name="priority" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <button type="submit" class="btn" style="padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Submit Report</button>
                <a href="{{ url_for('index') }}" style="color: #666; text-decoration: none; padding: 10px 15px;">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
