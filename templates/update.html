<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Problem Status - Campus Problem Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Update Problem Status</h2>
        <p><strong>Title:</strong> {{ problem['title'] }}</p>
        <p><strong>Location:</strong> Floor {{ problem['floor'] }}, Room {{ problem['room_number'] }} ({{ problem['area'] }})</p>
        <p><strong>Description:</strong> {{ problem['description'] }}</p>

        <form method="POST">
            <div class="form-group">
                <label for="status">Status:</label>
                <select name="status" id="status">
                    <option value="Pending" {% if problem['status'] == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="In Progress" {% if problem['status'] == 'In Progress' %}selected{% endif %}>In Progress</option>
                    <option value="Resolved" {% if problem['status'] == 'Resolved' %}selected{% endif %}>Resolved</option>
                </select>
            </div>
            
            <button type="submit" class="btn">Save Changes</button>
        </form>

        <p><a href="{{ url_for('index') }}">Cancel & Back to Dashboard</a></p>
    </div>
</body>
</html>
